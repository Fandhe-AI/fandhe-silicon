# scripts/public-api-webgpu-check.sh の語の一覧（`--config` で渡す）。
# 書式: `#` で始まる行と空行は無視する。1 行 1 語（前後の空白は除く）。語は `[a-z0-9]+` だけ。
#   節の前の語・未知の節・同じ節の重複・節内の語の重複・空の節は誤用（終了コード 2）。
# 節:
#   [blocking-words] 公開の関数・メソッド・再公開の名前を `_` で区切り、小文字にした語のどれかが一致したら違反にする語。
#                    語は feature `native-blocking-wait` の名前を区切ったものから取る。部分一致では当てない。
#   [webgpu-words]   公開の関数・メソッド・再公開・型（struct・enum・union・trait・type alias・variant）の名前を `_` と大文字小文字の
#                    切れ目で区切った語（小文字）の連続する部分をつないだ文字列が一致したら違反にする語。const・static は数えない。
#                    部分一致では当てない（ポインタ: TASK-155）。
# 変更の扱い: 語の追加・削除は private spec 側の記録に従う（ポインタ: TASK-241）。

[blocking-words]
blocking
wait

[webgpu-words]
webgpu
