# parity-host: GEMM と部分 Top-k の入力と、host の scalar 版の出力をファイルに書く host 側の道具。
# 製品の crate（crates/contract・crates/core）に path で依存する。
[package]
name = "wasm-parity-host"
version = "0.0.0"
description = "host-side tool that writes GEMM and partial top-k inputs and the native scalar outputs as files"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# glue と同じ feature の組にする。backend-* は入れない。
fandhe-silicon-contract = { path = "../../../crates/contract", default-features = false, features = ["contract-core", "cpu-isa", "cpu-ops"] }
# 入力の生成器（parity::gemm_inputs）は test-support の裏にある。
fandhe-silicon-core = { path = "../../../crates/core", features = ["test-support"] }

[lints]
workspace = true
