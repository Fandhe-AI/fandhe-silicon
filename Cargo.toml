# fandhe-silicon workspace（spec TASK-4: workspace と crate の骨格）。
#
# spec D-33（3 段 + 共通 crate）に対応する 4 crate 構成:
#   core     共通の型（3 段で受け渡す型。チップ crate に依存しない）
#   contract 下-1: チップごとの薄い呼び出し（backend-* feature で背後実装を持つ）
#   exec     下-2: 共通の操作と代わりの実行（core のみに依存）
#   upper    上: wgpu 風の層（#![forbid(unsafe_code)]）
# 依存の向き: contract → core / exec → core / upper → core, exec（spec BUILD-54〜58）。
# 公開名・MSRV は未決（spec TASK-1516 / TASK-1523）のため全 crate を publish = false とする。
# 依存の追加はユーザー承認制・=x.y.z 完全固定（.claude/rules/dependency-policy.md）。
[workspace]
resolver = "3"
members = ["crates/core", "crates/contract", "crates/exec", "crates/upper"]
# 比較基準の wgpu は基盤の外の別 workspace に置く（spec TASK-7 / BUILD-50 のポインタ）。
# 基盤の依存グラフに入れないため、baseline-wgpu/ は member にせず切り離す。
# 測定専用の別 workspace は measure/（spec TASK-6・TASK-27 のポインタ）。同じく製品の依存グラフに入れない。
exclude = ["baseline-wgpu", "measure"]

[workspace.package]
# .claude/settings.json の PostToolUse（rustfmt）が行頭の `edition = "..."` を
# 本ファイルから読むため、この形式を維持すること。
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-silicon"
publish = false

[workspace.lints.rust]
# unsafe fn 内でも unsafe 操作ごとに unsafe ブロックと SAFETY 根拠を要求する
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# unsafe ブロックに `// SAFETY:` コメントを必須とする（.claude/rules/coding-rust.md）
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

# 依存クレート（workspace メンバー以外）のデバッグ情報を行番号のみにする。
# 依存グラフ全体の full debuginfo はローカルの `target/` 肥大化（他リポでは 20GB 超）と
# リンク時間の主因になるため、依存の内部をデバッガで追う機能だけを諦めて両方を減らす。
# - 残るもの: panic 位置・バックトレースの file:line・プロファイラの行番号
# - 失うもの: デバッガ（lldb / gdb）で依存クレートの変数・型を見る機能のみ
# - `"*"` はメンバー以外にだけ効くため、本リポのクレートは full debuginfo のまま
# - 依存のビルドスクリプト・proc-macro にも適用される（`build-override` より優先）
# - `test` と `inherits = "dev"` のプロファイルにも継承される。`release`・`bench` は不変
# - 2026-10-11 時点で外部依存は 0 のため実効は無く、依存を追加した時点から効く
# - profile は workspace ルートにだけ書ける（メンバーの `[profile]` は無視される）。
#   変更時は CI キャッシュへの影響を確認する（.claude/rules/github-actions.md「キーの設計」）
[profile.dev.package."*"]
debug = "line-tables-only"
