# ベース CI。ジョブ追加・変更時は .claude/rules/github-actions.md に従う。
#
# ローカル（`make check`）・Git hooks（lefthook.yml）・CI が同じコマンド契約を共有する。
# CI 側で独自のチェックを定義せず、scripts/ の実体を呼ぶ（make スキルの「入口は複数でも
# 実処理の定義は一つ」）。Rust の品質ゲートも `make verify` / `make deny` / `make deps-check` / `make test-deps-check` / `make test-inventory-trace-check` / `make test-session-record-check` / `make test-perf-record-check` / `make test-metal-session` / `make test-record-summary` / `make ci-frame-check` / `make test-ci-frame-check` / `make public-api-check` / `make test-public-api-check` / `make public-name-check` / `make test-public-name-check` / `make measure-verify` を呼ぶ。
# ジョブを追加したら必ず ci-complete の needs にも追加すること。
#
# runner: public リポジトリのため GitHub ホステッド（ubuntu-latest。test-hooks のみ macos-latest も）を使う。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # PR の古い実行のみ中断する。main への push はコミット SHA 単位のグループにし、待機中の実行も
  # 置換されないようにする（連続マージ時も各コミットの結果を残す）
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 検査ツールの pin の正（単一宣言点）。SHA256 は GitHub リリース資産を実際にダウンロードして
# 実測し、リリース API の digest と一致することを確認した値（2026-10-07）。
# バンプ時は VERSION と SHA256 を必ず同時に更新する。ローカルの推奨版（README）も合わせる。
env:
  EDITORCONFIG_CHECKER_VERSION: "3.6.1"
  EDITORCONFIG_CHECKER_SHA256: "cd32084fce5f3d49ba49697f362ac3a114989715c98819303247dd54c1f368b0"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  # cargo-deny（x86_64-unknown-linux-musl のリリース資産。実測とリリース API の digest の一致を確認: 2026-10-09）
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

jobs:
  check:
    name: "make check (editorconfig-checker + shellcheck)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（fandhe-frontend の ci.yml と同一 SHA に固定）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned lint tools
        # バージョン固定 + SHA256 検証済みのプリビルトバイナリを導入する。
        # ubuntu-latest にはプリインストールの shellcheck があるため、導入先を
        # GITHUB_PATH の先頭へ追加して pin 版を優先させる。
        # editorconfig-checker の配布物は bin/ec-linux-amd64 のため、scripts/check.sh が
        # 呼ぶコマンド名 editorconfig-checker へリネームして配置する。
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/lint-tools/bin"
          work_dir="${RUNNER_TEMP}/lint-tools/work"
          mkdir -p "${bin_dir}" "${work_dir}"
          cd "${work_dir}"

          ec_archive="ec-linux-amd64.tar.gz"
          curl -fsSLo "${ec_archive}" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EDITORCONFIG_CHECKER_VERSION}/${ec_archive}"
          echo "${EDITORCONFIG_CHECKER_SHA256}  ${ec_archive}" | sha256sum -c -
          tar -xzf "${ec_archive}" bin/ec-linux-amd64
          install -m 0755 bin/ec-linux-amd64 "${bin_dir}/editorconfig-checker"

          sc_archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "${sc_archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc_archive}"
          echo "${SHELLCHECK_SHA256}  ${sc_archive}" | sha256sum -c -
          tar -xJf "${sc_archive}" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${bin_dir}/shellcheck"

          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Show tool versions
        # pin 版が PATH 上で優先されていることを確認する（不一致は失敗させる）
        run: |
          set -euo pipefail
          make --version | head -n1
          editorconfig-checker --version
          shellcheck --version
          # リリースバイナリは `v3.6.1` のように v 接頭辞付きで出力する（Homebrew 版は付かない）
          actual_ec="$(editorconfig-checker --version)"
          actual_ec="${actual_ec#v}"
          actual_sc="$(shellcheck --version | sed -n 's/^version: //p')"
          [ "${actual_ec}" = "${EDITORCONFIG_CHECKER_VERSION}" ] || { echo "::error::editorconfig-checker ${actual_ec} != ${EDITORCONFIG_CHECKER_VERSION}"; exit 1; }
          [ "${actual_sc}" = "${SHELLCHECK_VERSION}" ] || { echo "::error::shellcheck ${actual_sc} != ${SHELLCHECK_VERSION}"; exit 1; }

      - name: make check
        run: make check

  # フックスクリプト（scripts/hooks/*.sh）自体の回帰テスト（.claude/rules/git-hooks.md）。
  # テストはフックに置かず CI で実行する。フックのテストの外部依存は bash + git のみで、ツールの導入は不要。
  # 開発者の多くは macOS でフックを実行するため、BSD 系の挙動と macOS 標準の bash 3.2
  # （lefthook は PATH 上の bash で起動する）でも検証する。
  # 実機（macOS）の上で直接実行する手順のスクリプト（回ごとの記録の形の検査・Metal の実機の回の手順）の回帰テストも、
  # 同じ理由でここで流す（check 名は増えない）。macOS では標準の bash 3.2 を明示した step でも流す。
  # 開発者が macOS で流す `make verify`（scripts/verify.sh）の記録の扱いと集計の道具の回帰テストも、macOS の標準の bash 3.2 で流す。
  # python3 と git は runner 同梱のものを使う（導入しない）。
  test-hooks:
    name: "hook script tests (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 実行した bash のバージョンはテスト出力の先頭行に表示される
      - name: make test-hooks
        run: make test-hooks

      - name: test-hooks with macOS system bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash scripts/hooks/test-hooks.sh

      - name: make test-session-record-check
        run: make test-session-record-check

      - name: make test-metal-session
        run: make test-metal-session

      # 上の 2 つの make は PATH 上の bash（runner に新しい bash があればそちら）で流れるので、
      # macOS では標準の bash 3.2 を明示して直接実行する（テストは自分を動かしている bash で本体を起動する）
      - name: session script tests with macOS system bash 3.2
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          /bin/bash scripts/test-session-record-check.sh
          /bin/bash scripts/test-metal-session.sh

      - name: record summary tests with macOS system bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-record-summary.sh

  # Rust の品質ゲート。ローカルの `make verify`（scripts/verify.sh: fmt --check / clippy
  # -D warnings / test）をそのまま実行し、チェック内容の定義を scripts/ に一本化する。
  # toolchain は rust-toolchain.toml を単一真実源とし、ホステッド runner 同梱の rustup で導入する。
  # `make verify` は試験の枠の記録を一時ディレクトリへ書かせ、試験の後に集計の表をこのジョブのログへ出して一時ディレクトリを消す
  # （記録のファイルは残さず、artifact にも PR の Summary にも出さない。「未実施」は失敗にならない）。
  verify:
    name: "make verify (fmt + clippy + test)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        # 引数なしの `rustup toolchain install` は rust-toolchain.toml の toolchain を導入する
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain

      - name: make verify
        run: make verify

      # verify ジョブ名（必須チェック名）は維持したまま、feature の組ごとの検査をここで追加実行する
      - name: make build-profiles (feature 組ごとの build / clippy / test + wasm32 check)
        run: make build-profiles

  # 依存の監査。ローカルの `make deny`（scripts/deny.sh）をそのまま実行する。
  # 必須チェック名（ジョブ名）を維持したまま、依存の完全固定・承認の記録の検査（`make deps-check`）と
  # その回帰テスト（`make test-deps-check`）もここで追加実行する（ジョブを増やさないため ci-complete の needs は不変）。
  # 一覧と項目の対応の検査の回帰テスト（`make test-inventory-trace-check`。合成 fixture だけで submodule 不要）も同様に追加実行する。
  # 回ごとの記録の形の検査の回帰テスト（`make test-session-record-check`。合成 fixture だけ）も同様に追加実行する。
  # Metal の実機の回の手順のスクリプトの回帰テスト（`make test-metal-session`。macOS のコマンドは偽のコマンドで差し替える）も同様に追加実行する。
  # 試験の枠の記録から集計を出す道具と `make verify` の記録の扱いの回帰テスト（`make test-record-summary`。合成の部品と偽の cargo）も同様に追加実行する。
  # CI の枠の検査（`make ci-frame-check`。本ファイルを入力にする）とその回帰テスト（`make test-ci-frame-check`。合成 fixture だけ）も同様に追加実行する。
  # 公開 API の wgpu 系の参照の検査（`make public-api-check`。走査した公開アイテムの数が `scanned:` / `record:` の行としてジョブのログに残る）とその回帰テスト（`make test-public-api-check`。一時 workspace の実物の rustdoc の JSON）も同様に追加実行する。
  # 公開 API の名前の検査（`make public-name-check`。`--source` は渡さない。走査の件数が `scanned:` / `record:` の行としてジョブのログに残る）とその回帰テスト（`make test-public-name-check`。一時 workspace の実物の rustdoc の JSON）も同様に追加実行する。
  # RUSTC_BOOTSTRAP はスクリプト内の rustdoc 呼び出しだけに限られ、ジョブの env には足さない。
  # 実物の入力の検査（`make inventory-trace-check`）はここでは走らせない（入力が private 側にあるため、本リポの CI には組み込まない）。
  # jq・python3 は runner 同梱のものを使う（導入しない。Python 3.11 未満・欠落は deps-check.sh が失敗にする）。
  # cargo-deny はバージョン固定 + SHA256 検証済みのプリビルトバイナリを導入する（check ジョブと同方針）。
  deny:
    name: "make deny (cargo-deny)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain

      - name: Install pinned cargo-deny
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/cargo-deny/bin"
          work_dir="${RUNNER_TEMP}/cargo-deny/work"
          mkdir -p "${bin_dir}" "${work_dir}"
          cd "${work_dir}"

          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo "${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${name}.tar.gz" | sha256sum -c -
          tar -xzf "${name}.tar.gz" "${name}/cargo-deny"
          install -m 0755 "${name}/cargo-deny" "${bin_dir}/cargo-deny"

          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Show cargo-deny version
        # pin 版が PATH 上で優先されていることを確認する（不一致は失敗させる）
        run: |
          set -euo pipefail
          actual="$(cargo-deny --version | awk '{print $2}')"
          [ "${actual}" = "${CARGO_DENY_VERSION}" ] || { echo "::error::cargo-deny ${actual} != ${CARGO_DENY_VERSION}"; exit 1; }

      - name: make deny
        run: make deny

      - name: make measure-verify
        # 測定専用の別 workspace（measure/）の fmt / clippy / test / 依存の検査。ジョブを増やさず deny ジョブで流す
        run: make measure-verify

      - name: Show jq / python3 versions
        # 判定はしない（版を記録に残すだけ。要件未達は deps-check.sh が終了コード 2 で失敗させる）
        run: |
          set -euo pipefail
          jq --version
          python3 --version

      - name: make deps-check
        run: make deps-check

      - name: make test-deps-check
        run: make test-deps-check

      - name: make test-inventory-trace-check
        run: make test-inventory-trace-check

      - name: make test-session-record-check
        run: make test-session-record-check

      - name: make test-perf-record-check
        run: make test-perf-record-check

      - name: make test-record-summary
        run: make test-record-summary

      - name: make ci-frame-check
        run: make ci-frame-check

      - name: make test-ci-frame-check
        run: make test-ci-frame-check

      - name: make test-metal-session
        run: make test-metal-session

      - name: make public-api-check
        run: make public-api-check

      - name: make test-public-api-check
        run: make test-public-api-check

      - name: make public-name-check
        run: make public-name-check

      - name: make test-public-name-check
        run: make test-public-name-check

  # squash merge では PR タイトルがそのままコミット件名になるため、commit-msg フックと
  # 同じスクリプトで Conventional Commits 形式を検証する（フックの CI 側の対）。
  # PR タイトルは任意文字列のため、${{ }} を run へ直接展開せず env 経由でファイルへ書き出す
  # （シェルインジェクション防止）。push イベントでは skipped になる（ci-complete で明示許容）。
  pr-title:
    name: "PR title (Conventional Commits)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          msg_file="${RUNNER_TEMP}/pr-title.txt"
          printf '%s\n' "${PR_TITLE}" > "${msg_file}"
          bash scripts/hooks/commit-msg-check.sh "${msg_file}"

  # 必須チェックの集約ジョブ。ruleset の required status checks には本ジョブに加えて各ジョブの
  # check 名も登録している（implement-issue-tree の自動マージ前ゲートの要件。.claude/rules/github-actions.md）。
  # ジョブの追加・改名・matrix 変更で check 名が変わる場合は ruleset 側も同時に更新する。
  # ジョブを追加したら必ず needs へも追加すること（漏れると未検査のままマージ可能になる）。
  # fail-closed: success 以外は失敗とし、skipped は条件付きジョブ（pr-title）が
  # 本来 skip されるべき状況（pull_request 以外のイベント）でのみ明示的に許容する。
  ci-complete:
    name: ci-complete
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - check
      - verify
      - deny
      - test-hooks
      - pr-title
    steps:
      - name: 全ジョブ結果の検証
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "${RESULTS}" | jq -e --arg ev "${EVENT_NAME}" 'to_entries | map(select((.value.result == "success" or (.key == "pr-title" and .value.result == "skipped" and $ev != "pull_request")) | not)) | length == 0' > /dev/null
