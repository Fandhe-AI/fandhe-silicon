# core: 3 段（contract / exec / upper）で受け渡す共通の型を置く crate。
# チップ crate（Metal / Vulkan / CUDA のバインディング）には依存しない（spec BUILD-54）。
[package]
name = "fandhe-silicon-core"
version = "0.0.0"
description = "Common types shared across the fandhe-silicon layers"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# テスト・検証専用（本番ビルドに含めない。default にも入れない）。
# 置き場と feature 名の説明は docs/parity-tool.md の「現状の形」。
[features]
test-support = []

[[test]]
name = "parity_cpu_reference"
required-features = ["test-support"]

[[test]]
name = "parity_pixel"
required-features = ["test-support"]

[[test]]
name = "parity_special_values"
required-features = ["test-support"]

[[test]]
name = "parity_tolerance"
required-features = ["test-support"]

[[test]]
name = "parity_topk"
required-features = ["test-support"]

[lints]
workspace = true
