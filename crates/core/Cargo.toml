# core: 3 段（contract / exec / upper）で受け渡す共通の型を置く crate。
# チップ crate（Metal / Vulkan / CUDA のバインディング）には依存しない（spec BUILD-54）。
[package]
name = "fandhe-silicon-core"
version = "0.0.0"
description = "Common types shared across the fandhe-silicon layers"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# テスト・検証専用（本番ビルドに含めない。default にも入れない）。
# 置き場と feature 名の説明は docs/parity-tool.md の「所在」。
[features]
test-support = []
# 故障の差し込み口（テスト専用。default にも本番の組にも入れない。説明は docs/contract-fault-injection.md）。
fault-injection = []
# download_blocking（ブロッキング待ちの取り出し）を MemoryOps に載せる。native 向けで、既定にも本番の組にも入れない。
native-blocking-wait = []
# 相互運用の口を載せる。既定にも本番の組にも入れない。裏にあるのは次の 3 つ（説明は docs/contract-interop-types.md）。
#   - interop モジュール（相互運用の公開の型と ExternalInterop trait。照合の純粋関数を含む）
#   - Device のアクセサ external_interop・physical_gpu_id
#   - submit_exportable（セマフォを export する意図の宣言付きの投入。CommandQueue に載る）
ext-interop = []
# 描画の公開の型と GraphicsOps を載せる（graphics モジュール）。契約の crate の同名の feature から転送される（説明は docs/graphics-types.md）。
graphics = []

