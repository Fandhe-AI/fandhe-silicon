# exec: 下-2（共通の操作と代わりの実行）。core のみに依存し、下-1 は共通型の
# trait オブジェクト経由で使う（spec BUILD-54〜58）。
[package]
name = "fandhe-silicon-exec"
version = "0.0.0"
description = "Common operations and fallback execution over the fandhe-silicon contract"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fandhe-silicon-core = { path = "../core" }

# download_blocking を使う device の形の列の渡し方を載せる。core の同名 feature へ転送する。既定では無効。
[features]
native-blocking-wait = ["fandhe-silicon-core/native-blocking-wait"]
# 試験用の口（Exec::force_unsupported など）を載せる。core の同名 feature へ転送する。既定では無効。
fault-injection = ["fandhe-silicon-core/fault-injection"]

# 試験用の device を使う。core の試験用の feature を付ける。
[dev-dependencies]
fandhe-silicon-core = { path = "../core", features = ["test-support", "fault-injection"] }

# device の形の列を使う試験なので、feature native-blocking-wait のビルドでだけ流す。
[[test]]
name = "device_operands"
required-features = ["native-blocking-wait"]

# 試験用の口（能力の差し替え・Native を外す指定・判定の差し込み）を使う試験なので、feature fault-injection のビルドでだけ流す。
[[test]]
name = "fault_injection_ports"
required-features = ["fault-injection"]

# device の形の列で長さの拒否を確かめる試験なので、feature native-blocking-wait のビルドでだけ流す。
[[test]]
name = "length_device"
required-features = ["native-blocking-wait"]

[lints]
workspace = true
