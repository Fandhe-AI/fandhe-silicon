# contract: 下-1（チップごとの薄い呼び出し）。Metal / Vulkan / CUDA の背後実装を
# backend-* feature で持ち、unsafe / FFI はこの crate の backend モジュールに閉じる。
[package]
name = "fandhe-silicon-contract"
version = "0.0.0"
description = "Thin per-chip backend calls (Metal / Vulkan / CUDA) behind the fandhe-silicon contract"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fandhe-silicon-core = { path = "../core" }

# feature 名は spec BUILD-47 / BUILD-8 / BUILD-65 に合わせる。
# backend-* は src/backend_*.rs のモジュールを有効にする（Vulkan・CUDA は wasm32 で外す。spec TASK-5）。
# default は CpuOnly プロファイル（contract-core・cpu-isa・cpu-ops）のみ。
[features]
default = ["contract-core", "cpu-isa", "cpu-ops"]
contract-core = []
cpu-isa = []
cpu-ops = []
native-blocking-wait = []
graphics = []
ext-interop = []
# backend-* は共通契約の入口（contract-core）を前提とする。artifact-inspection は Metal の成果物を検査するため backend-metal を要求する。
backend-metal = ["contract-core"]
backend-vulkan = ["contract-core"]
backend-cuda = ["contract-core"]
# テスト・診断専用（本番ビルドに含めない）
test-support = []
fault-injection = []
artifact-inspection = ["backend-metal"]

[lints]
workspace = true
