# contract: 下-1（チップごとの薄い呼び出し）。Metal / Vulkan / CUDA の背後実装を
# backend-* feature で持ち、unsafe / FFI はこの crate の backend モジュールに閉じる。
[package]
name = "fandhe-silicon-contract"
version = "0.0.0"
description = "Thin per-chip backend calls (Metal / Vulkan / CUDA) behind the fandhe-silicon contract"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fandhe-silicon-core = { path = "../core" }

# feature 名は spec BUILD-47 / BUILD-8 / BUILD-65 に合わせる。
# backend-* は src/backend_*.rs のモジュールを有効にする（Vulkan・CUDA は wasm32 で外す。spec TASK-5）。
# default は CpuOnly プロファイル（contract-core・cpu-isa・cpu-ops）のみ。
[features]
default = ["contract-core", "cpu-isa", "cpu-ops"]
contract-core = []
cpu-isa = []
cpu-ops = []
native-blocking-wait = []
graphics = []
ext-interop = []
# backend-* は共通契約の入口（contract-core）を前提とする。artifact-inspection は Metal の成果物を検査するため backend-metal を要求する。
backend-metal = ["contract-core"]
backend-vulkan = ["contract-core"]
backend-cuda = ["contract-core"]
# DX12 の compute の背後実装の置き場（中身なし・名前は仮。形は spec TASK-222、
# モジュールの骨格と依存の閉じ込めは TASK-234。参照: BUILD-17・D-26・D-32）。
backend-dx12-compute = ["contract-core"]
# GL（GLES）の背後実装の feature はここに足す（形は spec TASK-2581、骨格は TASK-2583）。
# テスト・診断専用（本番ビルドに含めない）
# test-support は core の同名 feature（検証用の道具）へ転送する（説明は docs/parity-tool.md の「所在」）。
test-support = ["fandhe-silicon-core/test-support"]
# fault-injection は core の同名 feature（故障の差し込み口）へ転送する（説明は docs/contract-fault-injection.md）。
fault-injection = ["fandhe-silicon-core/fault-injection"]
artifact-inspection = ["backend-metal"]

[[test]]
name = "backend_vulkan_spirv_operands"
required-features = ["backend-vulkan", "test-support"]

[[test]]
name = "fault_injection_forwarding"
required-features = ["fault-injection"]

[[test]]
name = "fault_injection_parts"
required-features = ["fault-injection"]

[[test]]
name = "test_support_case_inputs"
required-features = ["test-support"]

[[test]]
name = "test_support_forwarding"
required-features = ["test-support"]

[[test]]
name = "test_support_pixel"
required-features = ["test-support"]

[[test]]
name = "test_support_special_values"
required-features = ["test-support"]

[[test]]
name = "test_support_test_frame"
required-features = ["test-support"]

[lints]
workspace = true
