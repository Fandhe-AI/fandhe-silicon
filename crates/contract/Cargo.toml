# contract: 下-1（チップごとの薄い呼び出し）。Metal / Vulkan / CUDA の背後実装を
# backend-* feature で持ち、unsafe / FFI はこの crate の backend モジュールに閉じる。
[package]
name = "fandhe-silicon-contract"
version = "0.0.0"
description = "Thin per-chip backend calls (Metal / Vulkan / CUDA) behind the fandhe-silicon contract"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fandhe-silicon-core = { path = "../core" }

# feature 名は spec BUILD-47 / BUILD-8 / BUILD-65 に合わせる（モジュールの骨格は spec TASK-5）。
# default は CpuOnly プロファイル（contract-core・cpu-isa・cpu-ops）のみ。
[features]
default = ["contract-core", "cpu-isa", "cpu-ops"]
contract-core = []
cpu-isa = []
cpu-ops = []
native-blocking-wait = []
graphics = []
ext-interop = []
backend-metal = []
backend-vulkan = []
backend-cuda = []
# テスト・診断専用（本番ビルドに含めない）
test-support = []
fault-injection = []
artifact-inspection = []

[lints]
workspace = true
