# scripts/public-name-check.sh の語の一覧（`--config` で渡す）。
# 書式: `#` で始まる行と空行は無視する。節は [names] / [words] / [calls] の 3 つで、3 つとも必須・各 1 語以上。
#   1 行 1 語（前後の空白は除く）。節の前の語・未知の節・同じ節の重複・節内の語の重複は誤用（終了コード 2）。
# 当て方:
#   [names] 公開アイテムの名前に当てる。名前も語も小文字にして ASCII の英数字以外を除いてから、部分一致で数える。
#   [words] --source で渡したソースに、大小文字を無視した単語単位（構成文字は英数字と _）で当てる。構成文字だけの語に限る。
#   [calls] --source で渡したソースに、大小文字を無視して部分一致で当てる呼び出しの形。
# 変更の扱い: 語の追加・削除は private spec 側の記録に従う（ポインタ: TASK-14）。

