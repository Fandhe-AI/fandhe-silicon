# kernel-accept: 実行時に受けるカーネルの一覧の検査・入口名の抜き出しと、一覧の 1 行からパイプラインを作るコマンド（TASK-485 のポインタ）。
# 契約の crate の公開 API と共通の crate、測定の腕の crate に path で依存する。向きは測定 → 製品の一方向だけにする。
[package]
name = "measure-kernel-accept"
version = "0.0.0"
description = "実行時に受けるカーネルの一覧の検査と入口名の抜き出し、一覧の 1 行からパイプラインを作るコマンド"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "accept-kernel"
path = "src/bin/accept-kernel.rs"

[dependencies]
fandhe-silicon-core = { path = "../../../crates/core", features = ["test-support"] }
measure-metal-gemm-arm = { path = "../metal-gemm-arm" }

[target.'cfg(target_os = "macos")'.dependencies]
fandhe-silicon-contract = { path = "../../../crates/contract", default-features = false, features = ["backend-metal"] }

[lints]
workspace = true
