# metal-gemm-arm: Metal 直接の GEMM の腕の crate（TASK-1008 のポインタ）。
# 製品の crate（共通）に path で依存する。向きは測定 → 製品の一方向だけにする。
[package]
name = "measure-metal-gemm-arm"
version = "0.0.0"
description = "固定の rev のカーネルのソースを sha256 で照らす道具と Metal 直接の GEMM の腕"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fetch-kernel-source"
path = "src/bin/fetch-kernel-source.rs"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[dependencies]
fandhe-silicon-core = { path = "../../../crates/core", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5" }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDataType", "MTLDevice", "MTLFunctionConstantValues", "MTLLibrary", "MTLResource", "MTLTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false }
